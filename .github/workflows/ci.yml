name: CI

# Tiered on purpose. CNA has 46 renderers across five platforms, and a naive
# "every renderer x every platform" matrix would be mostly impossible
# combinations (a GitHub runner cannot build a DirectX renderer on Linux, or
# Metal anywhere but macOS) and would take hours to tell you nothing.
#
#   Tier A  structure   every push — cheap, catches manifest/preset/doc drift
#   Tier B  core        every push — representative renderers, built AND run
#   Tier C  broad       scheduled/manual — wider renderer set, build only
#   Tier D  platforms   every push — web and Android, which need their own SDKs
#
# The renderer lists are NOT written here. They come from cmake/renderers.json
# via tools/gen_renderer_files.py --ci-matrix, so adding a renderer to the
# manifest is enough to put it in CI, and a renderer cannot be listed correctly
# in the manifest and wrongly in this file.

on:
  push:
  pull_request:
  schedule:
    - cron: '0 4 * * 1'   # Monday 04:00 UTC — tier C
  workflow_dispatch:
    inputs:
      broad:
        description: 'Run the broad (tier C) renderer matrix'
        type: boolean
        default: true

permissions:
  contents: read

env:
  # One place to change the validated compatibility baseline. Keep in step with
  # dependencies.lock — the structure job checks that they agree.
  CNA_REF: 7a64362efef4119bf880459ef1704fb2c52199e2
  SHARP_RUNTIME_REF: f827a6c5349234d5ac938886788ed8eca8fe1c10
  EASY_GL_REF: 0b46d35c394a9fb6aea6a85c6587894b5013da33
  META_GL_REF: 571d3a62fe166b9781ac6193d137b12ff3757620
  FREE_DIRECT_REF: 934f72ff0c52902631fceeb52c006f3ed2767485

  # CNA always configures its vendored SDL3, even for the renderers that open no
  # window, so every Linux job needs SDL's own build dependencies. The runner
  # image ships the X11 runtime libraries but not their headers, and SDL treats
  # "no X11 and no Wayland development libraries" as a hard configure error — so
  # without these the build dies inside SDL before a renderer is ever compiled.
  # https://wiki.libsdl.org/SDL3/README-linux#build-dependencies
  SDL_LINUX_PACKAGES: >-
    libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev
    libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev
    wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev libegl-dev
    libudev-dev libdbus-1-dev libibus-1.0-dev libasound2-dev libpulse-dev

jobs:
  # --- Tier A -------------------------------------------------------------
  structure:
    name: Structure and drift
    runs-on: ubuntu-latest
    outputs:
      tier_b: ${{ steps.matrix.outputs.tier_b }}
      tier_c: ${{ steps.matrix.outputs.tier_c }}
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-template }
      - uses: actions/checkout@v4
        with:
          repository: openeggbert/cna
          ref: ${{ env.CNA_REF }}
          path: cna

      - name: Generated files match the manifest
        working-directory: cna-template
        # Also cross-checks the manifest against CNA's own canonical renderer
        # list, so a renderer added upstream fails here rather than silently
        # going missing from the template.
        run: python3 tools/gen_renderer_files.py --check

      - name: Pinned revisions match dependencies.lock
        working-directory: cna-template
        run: |
          set -eu
          fail=0
          check() {
            want=$(grep "^$1=" dependencies.lock | cut -d= -f2)
            if [ "$want" != "$2" ]; then
              echo "::error::dependencies.lock has $1=$want but the workflow pins $2"
              fail=1
            fi
          }
          check CNA           "$CNA_REF"
          check SHARP_RUNTIME "$SHARP_RUNTIME_REF"
          check EASY_GL       "$EASY_GL_REF"
          check META_GL       "$META_GL_REF"
          check FREE_DIRECT   "$FREE_DIRECT_REF"
          exit $fail

      - name: Presets parse
        working-directory: cna-template
        run: cmake --list-presets

      - id: matrix
        name: Build renderer matrices from the manifest
        working-directory: cna-template
        run: |
          echo "tier_b=$(python3 tools/gen_renderer_files.py --ci-matrix linux --tiers B)" >> "$GITHUB_OUTPUT"
          echo "tier_c=$(python3 tools/gen_renderer_files.py --ci-matrix linux --tiers C)" >> "$GITHUB_OUTPUT"

  # --- Tier B -------------------------------------------------------------
  linux-core:
    name: Linux ${{ matrix.renderer }}
    needs: structure
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        renderer: ${{ fromJSON(needs.structure.outputs.tier_b) }}
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-template }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/cna, ref: '${{ env.CNA_REF }}', path: cna }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/sharp-runtime, ref: '${{ env.SHARP_RUNTIME_REF }}', path: sharp-runtime }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/easy-gl, ref: '${{ env.EASY_GL_REF }}', path: easy-gl }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/meta-gl, ref: '${{ env.META_GL_REF }}', path: meta-gl }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache pkg-config xvfb \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libgl1-mesa-dev libglu1-mesa-dev mesa-utils \
            $SDL_LINUX_PACKAGES

      - name: Fetch CNA's vendored SDL submodules
        working-directory: cna
        run: git submodule update --init third_party/SDL third_party/SDL_image third_party/SDL_mixer third_party/enet

      - uses: hendrikmuhs/ccache-action@v1
        with: { key: 'linux-${{ matrix.renderer }}' }

      - name: Configure
        working-directory: cna-template
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCNA_GRAPHICS_RENDERER=${{ matrix.renderer }}

      - name: Build
        working-directory: cna-template
        run: cmake --build build --parallel 3

      # The smoke test carries a CTest label describing what it needs. The four
      # windowless renderers run with no display at all; the rest get Xvfb.
      - name: Smoke test (no display)
        working-directory: cna-template
        run: ctest --test-dir build -L headless --output-on-failure --no-tests=ignore

      - name: Smoke test (virtual display)
        working-directory: cna-template
        run: xvfb-run -a ctest --test-dir build -L display --output-on-failure --no-tests=ignore

  # --- Tier C -------------------------------------------------------------
  linux-broad:
    name: Linux ${{ matrix.renderer }} (build only)
    needs: structure
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        renderer: ${{ fromJSON(needs.structure.outputs.tier_c) }}
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-template }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/cna, ref: '${{ env.CNA_REF }}', path: cna }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/sharp-runtime, ref: '${{ env.SHARP_RUNTIME_REF }}', path: sharp-runtime }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/easy-gl, ref: '${{ env.EASY_GL_REF }}', path: easy-gl }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/meta-gl, ref: '${{ env.META_GL_REF }}', path: meta-gl }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/free-direct, ref: '${{ env.FREE_DIRECT_REF }}', path: free-direct }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libgl1-mesa-dev libglu1-mesa-dev libvulkan-dev \
            libgles-dev libshaderc-dev \
            $SDL_LINUX_PACKAGES

      - name: Fetch CNA's vendored SDL submodules
        working-directory: cna
        run: git submodule update --init third_party/SDL third_party/SDL_image third_party/SDL_mixer third_party/enet

      - uses: hendrikmuhs/ccache-action@v1
        with: { key: 'linux-broad-${{ matrix.renderer }}' }

      - name: Configure
        working-directory: cna-template
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCNA_GRAPHICS_RENDERER=${{ matrix.renderer }}

      - name: Build
        working-directory: cna-template
        run: cmake --build build --parallel 3

  # --- Tier D: platforms with their own SDKs ------------------------------
  web:
    name: Web (${{ matrix.renderer }})
    needs: structure
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # WEBGL2 is CNA's own web default; CANVAS is the WebGL-free DOM path.
        # Both are built to prove the per-renderer Emscripten link flags work —
        # a single global WebGL setting would break one of them.
        renderer: [WEBGL2, CANVAS]
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-template }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/cna, ref: '${{ env.CNA_REF }}', path: cna }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/sharp-runtime, ref: '${{ env.SHARP_RUNTIME_REF }}', path: sharp-runtime }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/easy-gl, ref: '${{ env.EASY_GL_REF }}', path: easy-gl }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/meta-gl, ref: '${{ env.META_GL_REF }}', path: meta-gl }

      - uses: mymindstorm/setup-emsdk@v14
        with: { version: 6.0.3 }

      - name: Fetch CNA's vendored SDL submodules
        working-directory: cna
        run: git submodule update --init third_party/SDL third_party/SDL_image third_party/SDL_mixer third_party/enet

      - name: Configure
        working-directory: cna-template
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DCNA_GRAPHICS_RENDERER=${{ matrix.renderer }}

      - name: Build
        working-directory: cna-template
        run: cmake --build build-web --parallel 3

      - name: Check the web artifacts exist
        working-directory: cna-template
        run: |
          set -eu
          for f in HelloGame.html HelloGame.js HelloGame.wasm HelloGame.data; do
            test -f "build-web/$f" || { echo "::error::missing build-web/$f"; exit 1; }
          done
          ls -la build-web/HelloGame.*

      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.renderer }}
          path: cna-template/build-web/HelloGame.*

  windows:
    name: Windows (MSVC, SDL_RENDERER)
    runs-on: windows-latest
    env:
      CMAKE_GENERATOR: Ninja
      # CMake 4 reads this from the environment as well as from -D, and unlike
      # -D it also reaches CNA's child cmake invocations. Passed as -D it
      # arrived as "3" rather than "3.5" — see missing.md CNA-12 — so the value
      # is quoted here and the failure path below prints what CMake stored.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-template }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/cna, ref: '${{ env.CNA_REF }}', path: cna }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/sharp-runtime, ref: '${{ env.SHARP_RUNTIME_REF }}', path: sharp-runtime }

      - name: Fetch CNA's vendored SDL submodules
        working-directory: cna
        run: git submodule update --init third_party/SDL third_party/SDL_image third_party/SDL_mixer third_party/enet

      # Ninja rather than a Visual Studio generator, and not for speed: CNA's
      # vendored SDL prebuild builds without --config and installs without one
      # either, so under any multi-config generator it compiles SDL into Debug/
      # and then looks for it in Release/ and dies. Single-config keeps the two
      # in step. See missing.md, CNA-10 — the pinned generator that used to be
      # here was hiding this behind an earlier failure.
      #
      # CMAKE_GENERATOR is the load-bearing half. CNA's prebuild is a separate
      # cmake invocation that is passed no -G at all, so it takes CMake's own
      # Windows default — Visual Studio — no matter what the parent build uses.
      # -G Ninja alone therefore changed nothing; the environment variable is
      # the only lever a consumer has over that child configure.
      - uses: ilammy/msvc-dev-cmd@v1

      # CMAKE_POLICY_VERSION_MINIMUM is CMake 4's own escape hatch for a
      # dependency that still declares cmake_minimum_required(VERSION < 3.5) —
      # here CNA's vendored enet. windows-latest ships CMake 4, ubuntu-latest
      # does not yet, which is the only reason the Linux jobs are unaffected.
      # See missing.md CNA-12.
      - name: Configure
        working-directory: cna-template
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCNA_GRAPHICS_RENDERER=SDL_RENDERER

      - name: Show what CMake stored for the policy minimum
        if: failure()
        working-directory: cna-template
        run: |
          cmake --version
          if (Test-Path build/CMakeCache.txt) {
            Select-String -Path build/CMakeCache.txt -Pattern 'POLICY_VERSION_MINIMUM'
          }
          Write-Host "env: '$env:CMAKE_POLICY_VERSION_MINIMUM'"

      - name: Build
        working-directory: cna-template
        run: cmake --build build --parallel 3

  android:
    name: Android (Gradle)
    runs-on: ubuntu-latest
    # Not gating pull requests on it: CNA's own documentation currently
    # disagrees with itself about whether the NDK cross-build works, so a
    # failure here is more likely to be upstream than to be this template.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-template }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/cna, ref: '${{ env.CNA_REF }}', path: cna }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/sharp-runtime, ref: '${{ env.SHARP_RUNTIME_REF }}', path: sharp-runtime }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3

      - name: Fetch CNA's vendored SDL submodules
        working-directory: cna
        run: git submodule update --init third_party/SDL third_party/SDL_image third_party/SDL_mixer third_party/enet

      - name: Assemble debug APK
        working-directory: cna-template/android
        run: ./gradlew --no-daemon assembleDebug -PcnaRootDir="${GITHUB_WORKSPACE}/cna"

      # AGP reports an NDK configure failure as "cmake ... finished with
      # non-zero exit value 1" and buries CMake's own message hundreds of lines
      # of Java stack trace above it. CMake's real stderr lands in
      # metadata_generation_stderr.txt under .cxx; the tree listing comes first
      # because an earlier version of this step matched only *.log and printed
      # nothing at all, which looked like there was nothing to find.
      - name: Show the NDK CMake failure
        if: failure()
        working-directory: cna-template/android
        run: |
          echo "::group::.cxx tree"
          find app/.cxx app/build/intermediates/cxx -type f 2>/dev/null | head -200 || true
          echo "::endgroup::"
          find app/.cxx app/build/intermediates/cxx -type f \
               \( -name '*.txt' -o -name '*.log' -o -name '*.json' \) 2>/dev/null |
          grep -v metadata_generation_stderr |
          head -40 |
          while read -r f; do
            echo "::group::$f"; tail -c 20000 "$f"; echo; echo "::endgroup::"
          done || true
          # Last on purpose: this is the file that holds CMake's own error, and
          # the log API can only reach the end of a job's log. Everything above
          # is context; this is the answer.
          find app/.cxx -name 'metadata_generation_stderr.txt' 2>/dev/null |
          while read -r f; do
            echo "=== $f ==="; cat "$f"
          done || true
